name: Build release download

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package Pager Tracker
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $packageRoot = Join-Path $env:RUNNER_TEMP 'PagerTracker'
          $packagePath = Join-Path $env:RUNNER_TEMP 'PagerTracker-Windows-x64.zip'

          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item -LiteralPath 'publish' -Destination (Join-Path $packageRoot 'publish') -Recurse -Force
          Copy-Item -LiteralPath 'Build-PagerTracker.ps1' -Destination $packageRoot -Force
          Copy-Item -LiteralPath 'Install-PagerTracker.ps1' -Destination $packageRoot -Force
          Copy-Item -LiteralPath 'README.txt' -Destination $packageRoot -Force
          Copy-Item -LiteralPath 'LICENSE' -Destination $packageRoot -Force

          Compress-Archive -LiteralPath (Join-Path $packageRoot '*') -DestinationPath $packagePath -Force
          "PACKAGE_PATH=$packagePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload package for manual workflow runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PagerTracker-Windows-x64
          path: ${{ env.PACKAGE_PATH }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE_PATH }}
          generate_release_notes: true
